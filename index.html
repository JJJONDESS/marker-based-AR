<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menu AR</title>
<!-- Core Stable WebAR Engines -->
<script type="module" src="https://googleapis.com"></script>
<script src="https://aframe.io"></script>
<script src="https://jsdelivr.net"></script>

<style>
  html, body { margin: 0; height: 100%; background: transparent; color: #fff; font-family: system-ui, sans-serif; overflow: hidden; }
  .a-enter-vr, .a-enter-ar { display: none !important; }
  .screen { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
            padding: 24px; text-align: center; background: #1c1410; z-index: 20; }
  .screen.on { display: flex; }
  h1 { font-size: 1.6rem; margin: 0 0 8px; }
  p { max-width: 30ch; line-height: 1.5; color: #e8d9cc; margin: 0 0 20px; }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 999px; padding: 14px 28px; margin: 6px;
           background: #e8452c; color: #fff; cursor: pointer; }
  button.plain { background: transparent; border: 1px solid #8a7466; color: #e8d9cc; }
  button:focus-visible { outline: 3px solid #ffd27a; outline-offset: 2px; }
  #hint { position: fixed; left: 0; right: 0; bottom: 24px; text-align: center; z-index: 10; pointer-events: none;
          text-shadow: 0 1px 4px #000; transition: opacity .3s; }
  #hud { position: fixed; top: 12px; right: 12px; z-index: 15; display: none; }
  #hud button { padding: 8px 16px; background: rgba(0,0,0,.55); font-size: .9rem; }
  model-viewer { width: 100%; height: 100%; --poster-color: transparent; }
  #viewer { padding: 0; }
  #viewer .bar { position: absolute; top: 12px; left: 12px; z-index: 2; }
</style>

<script>
  // Native Touch Gestures Component (Eliminates the external library crash)
  AFRAME.registerComponent('pizza-gestures', {
    init: function () {
      this.pizza = this.el;
      this.isScanning = true;
      this.touchStartDist = 0;
      this.initialScale = { x: 1.4, y: 1.4, z: 1.4 };

      // Bind touch events to screen controls
      window.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          this.startX = e.touches[0].clientX;
        } else if (e.touches.length === 2) {
          this.touchStartDist = this.getDistance(e.touches);
          const currentScale = this.pizza.getAttribute('scale');
          this.initialScale = { x: currentScale.x, y: currentScale.y, z: currentScale.z };
        }
      });

      window.addEventListener('touchmove', (e) => {
        if (e.touches.length === 1 && this.startX) {
          // One finger drag = Y-axis spinning
          let deltaX = e.touches[0].clientX - this.startX;
          let currentRotation = this.pizza.getAttribute('rotation');
          this.pizza.setAttribute('rotation', {
            x: currentRotation.x,
            y: currentRotation.y + deltaX * 0.4,
            z: currentRotation.z
          });
          this.startX = e.touches[0].clientX;
        } else if (e.touches.length === 2 && this.touchStartDist) {
          // Two finger pinch = Dynamic scale multiplier scaling
          let dist = this.getDistance(e.touches);
          let factor = dist / this.touchStartDist;
          let newScale = Math.min(Math.max(this.initialScale.x * factor, 0.4), 3.5);
          this.pizza.setAttribute('scale', { x: newScale, y: newScale, z: newScale });
        }
      });
    },
    getDistance: function (touches) {
      return Math.hypot(touches[0].clientX - touches[1].clientX, touches[0].clientY - touches[1].clientY);
    }
  });
</script>
</head>
<body>

<!-- Start UI screen -->
<div class="screen on" id="start">
  <h1>See your dish in 3D</h1>
  <p>Point your camera at a dish photo on the menu.</p>
  <button id="go">Open camera</button>
  <button class="plain" id="skip">View 3D without camera</button>
</div>

<!-- Fallback vanilla 3D viewer -->
<div class="screen" id="viewer">
  <div class="bar"><button class="plain" id="back">Back</button></div>
  <model-viewer id="mv" src="./pizza.glb" alt="Pizza" camera-controls auto-rotate
                ar ar-modes="scene-viewer quick-look" shadow-intensity="1" touch-action="pan-y">
  </model-viewer>
</div>

<!-- Error screen state -->
<div class="screen" id="error">
  <h1>Camera not available</h1>
  <p id="errmsg">Allow camera access in your browser, or view the dish in 3D instead.</p>
  <button id="err3d">View 3D</button>
</div>

<div id="hud"><button id="hud3d">3D view</button></div>
<div id="hint"></div>

<!-- A-Frame Space Studio Environment Matrix -->
<a-scene id="scene"
         mindar-image="imageTargetSrc: ./pizza-target.mind; autoStart: false; uiLoading: no; uiScanning: no; uiError: no; maxTrack: 1; filterMinCF: 0.0001; filterBeta: 0.001;"
         color-space="sRGB" renderer="colorManagement: true; physicallyCorrectLights: true"
         vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false"> 

  <a-assets>
    <a-asset-item id="pizza" src="./pizza.glb"></a-asset-item>
  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
  <a-light type="ambient" intensity="1.2"></a-light>
  <a-light type="directional" intensity="1" position="0.5 1 1"></a-light>

  <!-- MindAR Target Engine Component -->
  
    
    <!-- Stabilized Model Container with embedded native gesture handlers -->
    <a-gltf-model id="pizza-model" 
                  src="#pizza" 
                  pizza-gestures
                  position="0 -0.1 0.65" 
                  rotation="30 0 0"
                  scale="0.001 0.001 0.001" 
                  animation__scale="property: scale; to: 1.4 1.4 1.4; dur: 1500; easing: easeOutBack; startEvents: startARAnimation"
                  animation__rotation="property: rotation; from: 30 0 0; to: 30 360 0; dur: 1500; easing: easeOutQuad; startEvents: startARAnimation">
    </a-gltf-model>

  
</a-scene>

<script>
  const $ = id => document.getElementById(id);
  const show = id => { ['start','viewer','error'].forEach(s => $(s).classList.toggle('on', s === id)); };
  const scene = $('scene');
  const targetEntity = $("pizza-target");
  const pizzaModel = $("pizza-model");
  let started = false;
  let hasTriggered = false;

  function hint(t) { $('hint').textContent = t; }

  function open3D() {
    stopAR();
    show('viewer');
  }

  function stopAR() {
    try { if (started) scene.systems['mindar-image-system'].stop(); } catch (e) {}
    started = false;
    $('hud').style.display = 'none';
    hint('');
  }

  async function startAR() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      $('errmsg').textContent = 'This browser cannot open the camera. Open the link in Chrome or Safari, or view 3D instead.';
      show('error'); return;
    }
    hint('Starting camera…');
    $('start').classList.remove('on');
    try {
      const sys = scene.systems['mindar-image-system'];
      await sys.start();
      started = true;
      $('hud').style.display = 'block';
      hint('Point at the dish photo on the menu');
    } catch (e) {
      console.error(e);
      hint('');
      show('error');
    }
  }

  function ready() {
    $('go').onclick = startAR;
    $('skip').onclick = open3D;
    $('err3d').onclick = open3D;
    $('hud3d').onclick = open3D;
    $('back').onclick = () => { show('start'); };

    // Fire entrance pop animation the moment the printed target is localized
    targetEntity.addEventListener('targetFound', () => {
      if (!hasTriggered) {
        hint('');
        pizzaModel.emit("startARAnimation");
        hasTriggered = true; 
      } else {
        hint('Model detached! Use fingers to zoom or rotate.');
      }
    });

    // OVERRIDE: Keep the 3D entity alive and pinned in space if camera leaves target
    targetEntity.addEventListener('targetLost', () => {
      hint('Model detached! Use fingers to zoom or rotate.');
      targetEntity.object3D.visible = true; 
    });
  }
  
  ready();
</script>
</body>
</html>
