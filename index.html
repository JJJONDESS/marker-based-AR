<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menu AR</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
  /* IMPORTANT: no background on html/body, or it hides the camera feed */
  html, body { margin: 0; height: 100%; background: transparent; color: #fff; font-family: system-ui, sans-serif; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  .a-enter-vr, .a-enter-ar { display: none !important; }
  .screen { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
            padding: 24px; text-align: center; background: #1c1410; z-index: 20; }
  .screen.on { display: flex; }
  h1 { font-size: 1.6rem; margin: 0 0 8px; }
  p { max-width: 30ch; line-height: 1.5; color: #e8d9cc; margin: 0 0 20px; }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 999px; padding: 14px 28px; margin: 6px;
           background: #e8452c; color: #fff; }
  button.plain { background: transparent; border: 1px solid #8a7466; color: #e8d9cc; }
  button:disabled { opacity: .55; }
  #errmsg { max-width: 36ch; }
  #errcode { font-size: .75rem; opacity: .7; max-width: 36ch; word-break: break-word; }
  button:focus-visible { outline: 3px solid #ffd27a; outline-offset: 2px; }
  #hint { position: fixed; left: 0; right: 0; bottom: 24px; text-align: center; z-index: 10; pointer-events: none;
          text-shadow: 0 1px 4px #000; transition: opacity .3s; }
  #hud { position: fixed; top: 12px; right: 12px; z-index: 15; display: none; }
  #hud button { padding: 8px 16px; background: rgba(0,0,0,.55); font-size: .9rem; }
  button.alt { background: #fff; color: #1c1410; }
  #start { padding: 0; justify-content: flex-end; }
  #start model-viewer { position: absolute; inset: 0; width: 100%; height: 100%; --poster-color: transparent;
                        background: radial-gradient(circle at 50% 42%, #3a2a20, #1c1410 70%); }
  #start .top { position: absolute; top: 0; left: 0; right: 0; z-index: 2; pointer-events: none;
                padding: calc(28px + env(safe-area-inset-top, 0px)) 24px 0; text-shadow: 0 1px 6px #000; }
  #start .top p { margin: 0 auto; }
  #start .ui { position: relative; z-index: 2; width: 100%; box-sizing: border-box; display: flex; flex-direction: column;
               align-items: center; pointer-events: none;
               padding: 80px 24px calc(24px + env(safe-area-inset-bottom, 0px));
               background: linear-gradient(transparent, rgba(28,20,16,.92) 55%); }
  #start .ui button { pointer-events: auto; width: min(100%, 320px); box-sizing: border-box; }
  #start .back3d { display: none; position: absolute; left: 0; right: 0; top: 0; z-index: 3; justify-content: space-between;
                   pointer-events: none; padding: calc(12px + env(safe-area-inset-top, 0px)) 12px 0; }
  #start .back3d button { pointer-events: auto; padding: 10px 18px; }
  #start.only3d .top, #start.only3d .ui { display: none; }
  #start.only3d .back3d { display: flex; }
</style>
</head>
<body>

<!-- 1. Start screen: live 3D preview of the dish + 3 ways to view it -->
<div class="screen on" id="start">
  <model-viewer id="mv" alt="3D pizza" camera-controls auto-rotate interaction-prompt="none"
                ar ar-modes="scene-viewer quick-look" shadow-intensity="1" loading="eager">
    <button slot="ar-button" style="display:none"></button>
  </model-viewer>

  <div class="top">
    <h1>See your dish in 3D</h1>
    <p id="sub">Loading your 3D dish…</p>
  </div>

  <div class="ui">
    <button id="go" disabled>Loading…</button>
    <button id="ar" class="alt" style="display:none">View in your space (AR)</button>
    <button class="plain" id="skip">View 3D without camera</button>
  </div>

  <!-- shown when "View 3D without camera" is tapped -->
  <div class="back3d">
    <button class="plain" id="back">Back</button>
    <button id="ar2" class="alt" style="display:none">View in your space (AR)</button>
  </div>
</div>

<!-- 3. Error message -->
<div class="screen" id="error">
  <h1 id="errtitle">Camera not available</h1>
  <p id="errmsg">Allow camera access in your browser, or view the dish in 3D instead.</p>
  <p id="errcode"></p>
  <button id="errretry">Try again</button>
  <button class="plain" id="err3d">View 3D</button>
</div>

<div id="hud"><button id="detach">Detach</button><button id="mode" style="display:none">Drag: Rotate</button><button id="hud3d">3D view</button></div>
<div id="hint"></div>

<!-- AR scene: autoStart is off so we start it after the customer taps the button -->
<a-scene id="scene"
         mindar-image="imageTargetSrc: ./pizza-target.mind; autoStart: false; uiLoading: no; uiScanning: no; uiError: no; maxTrack: 1;"
         color-space="sRGB" renderer="colorManagement: true; physicallyCorrectLights: true"
         vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">

  <a-assets>
    <a-asset-item id="pizza" src="./pizza.glb"></a-asset-item>
  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
  <a-light type="ambient" intensity="1.2"></a-light>
  <a-light type="directional" intensity="1" position="0.5 1 1"></a-light>

  <!-- Target 0 = the first image you compiled (the pizza photo) -->
  <a-entity id="t0" mindar-image-target="targetIndex: 0">
    <!-- pop = 1.5s pop-up + 360 spin | zoom = pinch | tilt/spin = finger drag -->
    <a-entity id="pop" scale="0.001 0.001 0.001"
              animation__pop="property: scale; from: 0.001 0.001 0.001; to: 1 1 1; dur: 1500; easing: easeOutBack; startEvents: popstart"
              animation__spin="property: rotation; from: 0 0 0; to: 0 0 360; dur: 1500; easing: easeOutCubic; startEvents: popstart">
      <a-entity id="zoom">
        <a-entity id="tilt">
          <a-entity id="spin">
            <!-- TUNE THESE: rotation lays the model flat, scale sets size (1 = width of the menu photo), position lifts it -->
            <a-gltf-model src="#pizza" rotation="90 0 0" position="0 0 0.02" scale="0.5 0.5 0.5"></a-gltf-model>
          </a-entity>
        </a-entity>
      </a-entity>
    </a-entity>
  </a-entity>
</a-scene>

<script>
  const $ = id => document.getElementById(id);
  const show = id => { ['start','error'].forEach(s => $(s).classList.toggle('on', s === id)); $('start').classList.remove('only3d'); };
  const scene = $('scene');
  let started = false;

  function hint(t) { $('hint').textContent = t; }

  function open3D() {
    stopAR();
    show('start');
    $('start').classList.add('only3d');
  }

  function stopAR() {
    try { if (started) scene.systems['mindar-image-system'].stop(); } catch (e) {}
    started = false;
    $('hud').style.display = 'none';
    hint('');
  }

  let lastArError = '';
  scene.addEventListener('arError', ev => { lastArError = (ev.detail && ev.detail.error) || 'arError'; });

  function showError(title, msg, code) {
    $('errtitle').textContent = title;
    $('errmsg').textContent = msg;
    $('errcode').textContent = code || '';
    show('error');
  }

  // The scene (model + image data) must finish loading before the camera can start
  const whenReady = () => new Promise(res => {
    if (scene.renderStarted) return res();
    scene.addEventListener('renderstart', () => res(), { once: true });
  });
  whenReady().then(() => { $('go').disabled = false; $('go').textContent = 'Open camera'; });

  const sys = () => scene.systems['mindar-image-system'];
  const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);
  const hasWebGL = () => { try { const c = document.createElement('canvas'); return !!(c.getContext('webgl') || c.getContext('experimental-webgl')); } catch (e) { return false; } };

  // After a failure, test the camera directly so we can tell "camera problem" from "AR engine problem"
  async function diagnose(e) {
    const base = 'webgl:' + (hasWebGL() ? 'yes' : 'no');
    try {
      const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      s.getTracks().forEach(t => t.stop());
      return { cam: true, code: base + ' · ' + (lastArError || (e && (e.name || e.message)) || 'unknown') };
    } catch (ce) {
      return { cam: false, name: ce.name || '', code: base + ' · ' + (ce.name || 'camera error') };
    }
  }

  async function startAR() {
    if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showError('Camera not supported', 'This browser cannot open the camera. Open the link in Chrome or Safari, or view 3D instead.', 'no getUserMedia');
      return;
    }
    hint('Starting camera…');
    $('start').classList.remove('on');
    lastArError = '';
    try {
      await whenReady();
      try { await withTimeout(sys().start(), 30000); }
      catch (e1) {
        try { sys().stop(); } catch (_) {}
        await new Promise(r => setTimeout(r, 700));
        await withTimeout(sys().start(), 30000);   // one silent retry
      }
      started = true;
      $('hud').style.display = 'block';
      hint('Point at the dish photo on the menu');
    } catch (e) {
      console.error(e);
      try { sys().stop(); } catch (_) {}
      hint('');
      const d = await diagnose(e);
      if (d.cam) {
        showError('AR could not start', 'The camera works, but this phone or browser could not run the AR engine. Open the link in Chrome (updated), or use the 3D view.', d.code);
      } else {
        let msg = 'The browser could not open the camera.';
        if (/NotAllowed|Security/.test(d.name)) msg = 'The camera is blocked for this site. Tap the lock icon next to the address, choose Permissions, then Camera, then Allow, and reload. Also check Android Settings > Apps > your browser > Permissions > Camera.';
        else if (/NotReadable/.test(d.name)) msg = 'Another app is using the camera. Close it and try again.';
        else if (/NotFound|Overconstrained/.test(d.name)) msg = 'No usable camera was found on this phone.';
        showError('Camera not available', msg, d.code);
      }
    }
  }

  // Wire up buttons
  $('go').onclick = startAR;
  $('skip').onclick = open3D;
  $('err3d').onclick = open3D;
  $('errretry').onclick = () => show('start');
  $('hud3d').onclick = open3D;
  $('back').onclick = () => { show('start'); };

  // Hero 3D preview. It loads after the AR scene has fetched pizza.glb, so the same file comes from cache instead of downloading twice.
  const mv = $('mv');
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const SHOW_AR_ON_ANDROID = false;   // set to true to also show "View in your space" on Android phones
  let heroSet = false;
  const loadHero = () => { if (!heroSet) { heroSet = true; mv.src = './pizza.glb'; } };
  const checkAR = () => {
    const ok = mv.canActivateAR && (isIOS || SHOW_AR_ON_ANDROID);
    $('ar').style.display = ok ? '' : 'none';
    $('ar2').style.display = ok ? '' : 'none';
  };
  mv.addEventListener('load', () => {
    $('sub').textContent = 'Drag to spin it · pinch to zoom';
    checkAR(); setTimeout(checkAR, 400);
  });
  mv.addEventListener('error', () => { $('sub').textContent = 'Point your camera at a dish photo on the menu.'; });
  $('ar').onclick = $('ar2').onclick = () => mv.activateAR();
  Promise.race([whenReady(), new Promise(r => setTimeout(r, 6000))]).then(loadHero);

  const pop = $('pop'), tilt = $('tilt'), spin = $('spin'), zoom = $('zoom'), t0 = $('t0'), dbtn = $('detach');
  let found = false, detached = false, gone = true, goneTimer = null;
  let rx = 0, rz = 0, zv = 1;
  const D2R = Math.PI / 180;

  // Pop-up + 360 spin (1.5s). Replays only if the photo was lost for more than 1.2s.
  const playPop = () => pop.emit('popstart');

  t0.addEventListener('targetFound', () => {
    found = true; clearTimeout(goneTimer);
    if (!detached) hint('Drag to rotate · pinch to zoom');
    if (!detached && gone) { gone = false; playPop(); }
  });
  t0.addEventListener('targetLost', () => {
    found = false;
    if (!detached) hint('Point at the dish photo on the menu');
    clearTimeout(goneTimer);
    goneTimer = setTimeout(() => { gone = true; }, 1200);
  });

  // Detach: move the model from the photo onto the camera, keeping its current size/position.
  dbtn.onclick = () => {
    if (!detached) {
      if (!found) { hint('Point at the dish photo first'); return; }
      document.querySelector('a-camera').object3D.attach(pop.object3D);
      detached = true; dbtn.textContent = 'Attach back';
      $('mode').style.display = 'inline-block';
      hint('Drag to rotate · pinch to zoom · two fingers to move');
    } else {
      t0.object3D.add(pop.object3D);
      pop.object3D.position.set(0, 0, 0); pop.object3D.quaternion.identity(); pop.object3D.scale.set(1, 1, 1);
      detached = false; dbtn.textContent = 'Detach';
      moveMode = false; $('mode').textContent = 'Drag: Rotate'; $('mode').style.display = 'none';
      hint(found ? '' : 'Point at the dish photo on the menu');
      if (found) playPop();
    }
  };

  // Gestures: one finger = rotate/tilt, two fingers = pinch zoom
  let moveMode = false;
  $('mode').onclick = () => {
    moveMode = !moveMode;
    $('mode').textContent = moveMode ? 'Drag: Move' : 'Drag: Rotate';
  };

  // Slide the detached model across the screen (pixels -> camera-space units at the model's depth)
  function pan(dx, dy) {
    const o = pop.object3D.position;
    const f = scene.camera && scene.camera.projectionMatrix.elements[5];
    const h = (scene.canvas && scene.canvas.clientHeight) || window.innerHeight;
    const k = f ? (2 * (Math.abs(o.z) || 1)) / (f * h) : 0.002;
    o.x += dx * k; o.y -= dy * k;
  }

  const pts = new Map(); let lastD = 0;
  const dist = () => { const [a, b] = [...pts.values()]; return Math.hypot(a.x - b.x, a.y - b.y); };
  addEventListener('pointerdown', e => {
    if (!started || e.target.closest('button')) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 2) lastD = dist();
  });
  addEventListener('pointermove', e => {
    const p = pts.get(e.pointerId); if (!p) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;
    if (pts.size === 1) {
      if (detached && moveMode) pan(dx, dy);
      else {
        rz += dx * 0.6; rx = Math.max(-100, Math.min(100, rx + dy * 0.4));
        spin.object3D.rotation.z = rz * D2R; tilt.object3D.rotation.x = rx * D2R;
      }
    } else if (pts.size === 2) {
      const d = dist(); if (lastD) zv = Math.max(0.4, Math.min(4, zv * d / lastD));
      lastD = d; zoom.object3D.scale.setScalar(zv);
      if (detached) pan(dx / 2, dy / 2);   // the midpoint of two fingers moves half as far as each finger
    }
  });
  ['pointerup', 'pointercancel'].forEach(t => addEventListener(t, e => pts.delete(e.pointerId)));
</script>
</body>
</html>
